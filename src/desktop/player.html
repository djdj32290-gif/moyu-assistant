<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频待看</title><link rel="stylesheet" href="buttons.css"><link rel="stylesheet" href="player.css"></head>
<body><main id="window">
  <section id="screen" aria-label="视频播放器"></section>
  <div id="video-top"><button id="quiet" class="textbutton" type="button" title="悬停隐藏按钮和鼠标；移动鼠标或按 Esc 恢复">安静观看</button><button id="move" class="textbutton video-move" type="button" title="按住拖动，方向键移动">移动</button><button id="video-next" class="textbutton" type="button" aria-label="播放下一条视频">下一条</button><button id="video-close" class="textbutton" type="button" aria-label="关闭视频小窗">关闭视频</button></div>
  <button id="tools-left" class="video-tools-toggle" type="button" data-side="left" aria-label="从左侧展开视频控制区" aria-expanded="false" title="悬停或点击展开控制区"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
  <button id="tools-toggle" class="video-tools-toggle" type="button" data-side="right" aria-label="从右侧展开视频控制区" aria-expanded="false" title="悬停或点击展开控制区"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
  <div id="quiet-screen" hidden aria-label="安静观看，移动鼠标或按 Esc 恢复操作"></div>
  <div id="resize-grips" aria-hidden="true"><div data-resize="10"></div><div data-resize="11"></div><div data-resize="12"></div><div data-resize="15"></div><div data-resize="13"></div><div data-resize="14"></div><div data-resize="16"></div><div data-resize="17"></div></div>
  <aside id="tools" hidden aria-label="视频控制区">
    <div id="preferences"><label><input id="hover" type="checkbox" checked>移出隐藏</label><label><input id="pin" type="checkbox" checked>置顶</label></div>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <div id="title-mode" role="group" aria-label="标题显示方式"><span>标题</span><button class="textbutton" id="title-expanded" type="button" aria-pressed="true">展开</button><button class="textbutton" id="title-collapsed" type="button" aria-pressed="false">收起</button></div>
    <section id="queue-section"><div class="queue-heading"><strong>视频待看</strong><span id="queue-count">0 条</span></div><button class="textbutton danger" id="clear-watched" disabled>清除已看视频</button><div class="provider-tabs" id="queue-platforms" role="tablist" aria-label="按平台筛选"><button class="provider-tab" id="queue-platform-all" type="button" role="tab" aria-selected="true" aria-controls="queue" tabindex="0" data-provider="all">全部</button><button class="provider-tab" id="queue-platform-bilibili" type="button" role="tab" aria-selected="false" aria-controls="queue" tabindex="-1" data-provider="bilibili">B站</button><button class="provider-tab" id="queue-platform-huya" type="button" role="tab" aria-selected="false" aria-controls="queue" tabindex="-1" data-provider="huya">虎牙</button><button class="provider-tab" id="queue-platform-other" type="button" role="tab" aria-selected="false" aria-controls="queue" tabindex="-1" data-provider="other">其他</button></div><ul id="queue" aria-label="待看视频列表"></ul></section>
  </aside>
</main><script src="video-common.js"></script><script src="player.js"></script></body></html>
